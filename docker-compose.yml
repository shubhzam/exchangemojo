services:
  postgres:
    image: postgres:18-alpine
    container_name: crypto-exchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_DB: exchange
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange -d exchange"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data: